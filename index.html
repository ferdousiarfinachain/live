    <script>
      ;(function () {
        var host = location.hostname
        if (
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host.endsWith('.localhost') ||
          host.indexOf(':') !== -1 ||
          host.split('.').length < 2 ||
          host.indexOf('www.') === 0
        ) {
          return
        }
        location.replace(
          location.protocol +
            '//www.' +
            host +
            location.pathname +
            location.search +
            location.hash,
        )
      })()
    </script>
